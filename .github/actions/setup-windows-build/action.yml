name: Set up Windows build
description: Set up Python, SCons caches, and Godot for Windows jobs.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  architecture:
    description: CPU architecture used to build godot-cpp.
    required: false
    default: "x86_64"
  scons-cache:
    description: SCons cache directory.
    required: true
  scons-version:
    description: SCons version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SCons
      shell: pwsh
      run: python -m pip install --upgrade pip scons==${{ inputs.scons-version }}

    - name: Resolve godot-cpp revision
      id: godot-cpp-revision
      shell: pwsh
      run: |
        $revision = git -C godot-cpp rev-parse HEAD
        "sha=$revision" >> $env:GITHUB_OUTPUT

    - name: Restore godot-cpp SCons outputs
      id: godot-cpp-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.scons-cache }}
        key: godot-cpp-v1-windows-${{ inputs.architecture }}-scons-${{ inputs.scons-version }}-${{ steps.godot-cpp-revision.outputs.sha }}

    - name: Build godot-cpp cache
      if: steps.godot-cpp-cache.outputs.cache-hit != 'true'
      working-directory: godot-cpp
      shell: pwsh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: |
        python -m SCons -Q platform=windows arch=${{ inputs.architecture }} target=template_debug
        python -m SCons -Q platform=windows arch=${{ inputs.architecture }} target=template_release

    - name: Save godot-cpp SCons outputs
      if: steps.godot-cpp-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.scons-cache }}
        key: godot-cpp-v1-windows-${{ inputs.architecture }}-scons-${{ inputs.scons-version }}-${{ steps.godot-cpp-revision.outputs.sha }}

    - name: Resolve Godot version
      id: godot-version
      shell: pwsh
      run: |
        $version = python scripts/build.py --print-godot-version
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Cache Godot engine
      uses: actions/cache@v4
      with:
        path: build/.cache/godot
        key: godot-engine-windows-${{ steps.godot-version.outputs.version }}

    - name: Set up Godot engine
      shell: pwsh
      run: python scripts/build.py --setup-godot-env
