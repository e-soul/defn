name: Set up Linux build
description: Set up native dependencies, Python, SCons caches, and Godot for Linux jobs.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  scons-cache:
    description: SCons cache directory.
    required: true
  scons-version:
    description: SCons version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes build-essential clang clang-tidy llvm pkg-config

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Resolve godot-cpp revision
      id: godot-cpp-revision
      shell: bash
      run: echo "sha=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache godot-cpp SCons outputs
      uses: actions/cache@v4
      with:
        path: ${{ inputs.scons-cache }}
        key: godot-cpp-linux-${{ inputs.scons-version }}-${{ steps.godot-cpp-revision.outputs.sha }}

    - name: Resolve Godot version
      id: godot-version
      shell: bash
      run: echo "version=$(python scripts/build.py --print-godot-version)" >> "$GITHUB_OUTPUT"

    - name: Cache Godot engine
      uses: actions/cache@v4
      with:
        path: build/.cache/godot
        key: godot-engine-linux-${{ steps.godot-version.outputs.version }}

    - name: Install SCons
      shell: bash
      run: python -m pip install --upgrade pip scons==${{ inputs.scons-version }}

    - name: Set up Godot engine
      shell: bash
      run: python scripts/build.py --platform linux --setup-godot-env
