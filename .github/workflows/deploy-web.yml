name: Deploy Web to Pages

on:
  workflow_dispatch:

run-name: Deploy Web from ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build-web:
    name: Build and test Web export
    uses: ./.github/workflows/web-ci.yml
    with:
      upload-pages: true
    secrets: inherit

  deploy-pages:
    name: Deploy Web export to GitHub Pages
    needs: build-web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
