name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} release
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows
            runner: windows-2022
          - name: Linux
            platform: linux
            runner: ubuntu-24.04

    env:
      SCONS_CACHE: ${{ github.workspace }}/build/.scons-cache
      SCONS_VERSION: "4.10.1"

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEFN_ASSETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEFN_ASSETS_APP_PRIVATE_KEY }}
          owner: e-soul
          repositories: |
            defn
            defn-assets
          permission-contents: read

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Windows build
        if: matrix.platform == 'windows'
        uses: ./.github/actions/setup-windows-build
        with:
          scons-cache: ${{ env.SCONS_CACHE }}
          scons-version: ${{ env.SCONS_VERSION }}

      - name: Set up Linux build
        if: matrix.platform == 'linux'
        uses: ./.github/actions/setup-linux-build
        with:
          scons-cache: ${{ env.SCONS_CACHE }}
          scons-version: ${{ env.SCONS_VERSION }}

      - name: Build and export ${{ matrix.name }} release
        run: python scripts/build.py --platform "${{ matrix.platform }}" --build-version "${{ github.ref_name }}"

      - name: Upload ${{ matrix.name }} release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-release
          path: build/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
