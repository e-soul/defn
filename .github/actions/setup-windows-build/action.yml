name: Set up Windows build
description: Set up Python, SCons caches, and Godot for Windows jobs.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  architecture:
    description: CPU architecture used to build the project and godot-cpp.
    required: false
    default: "x86_64"
  configuration:
    description: Build profile used by the caller (coverage or release).
    required: true
  cache-export-templates:
    description: Cache the Godot export-template archive for release jobs.
    required: false
    default: "false"
  scons-cache:
    description: SCons cache directory.
    required: true
  scons-version:
    description: SCons version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SCons
      shell: pwsh
      run: python -m pip install --upgrade pip scons==${{ inputs.scons-version }}

    - name: Select LLVM tools
      shell: pwsh
      run: |
        $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
        if (Test-Path $llvmBin) {
          $llvmBin >> $env:GITHUB_PATH
        }

    - name: Cache project and godot-cpp compiler outputs
      uses: ./.github/actions/cache-scons
      with:
        platform: windows
        architecture: ${{ inputs.architecture }}
        configuration: ${{ inputs.configuration }}
        scons-cache: ${{ inputs.scons-cache }}
        scons-version: ${{ inputs.scons-version }}

    - name: Resolve Godot version
      id: godot-version
      shell: pwsh
      run: |
        $version = python scripts/build.py --print-godot-version
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Cache Godot editor
      uses: actions/cache@v4
      with:
        path: build/.cache/godot/${{ steps.godot-version.outputs.version }}.stable/windows
        key: godot-editor-v1-windows-${{ inputs.architecture }}-${{ steps.godot-version.outputs.version }}

    - name: Cache Godot export templates
      if: inputs.cache-export-templates == 'true'
      uses: actions/cache@v4
      with:
        path: build/.cache/godot/${{ steps.godot-version.outputs.version }}.stable/export_templates.tpz
        key: godot-export-templates-v1-windows-${{ inputs.architecture }}-${{ steps.godot-version.outputs.version }}

    - name: Set up Godot engine
      shell: pwsh
      run: python scripts/build.py --setup-godot-env
